name: Add Arabic letter selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[arabic-selector]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only Arabic selector changes
        shell: python
        run: |
          from pathlib import Path
          import re

          # LettersScreen: add the requested fourth button without touching audio or layout sizes.
          p = Path('app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = '''                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                    if (mode == LetterMode.FORMS) {
                        FormButton("أولي", form == ArabicLetterForm.INITIAL) { form = ArabicLetterForm.INITIAL; onTap() }
                        FormButton("وسطي", form == ArabicLetterForm.MEDIAL) { form = ArabicLetterForm.MEDIAL; onTap() }
                        FormButton("أخري", form == ArabicLetterForm.FINAL) { form = ArabicLetterForm.FINAL; onTap() }
                    } else {'''
          new = '''                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                    if (mode == LetterMode.FORMS) {
                        FormButton("الحروف", false) { onTap() }
                        FormButton("أولي", form == ArabicLetterForm.INITIAL) { form = ArabicLetterForm.INITIAL; onTap() }
                        FormButton("وسطي", form == ArabicLetterForm.MEDIAL) { form = ArabicLetterForm.MEDIAL; onTap() }
                        FormButton("أخري", form == ArabicLetterForm.FINAL) { form = ArabicLetterForm.FINAL; onTap() }
                    } else {'''
          if old not in s:
              raise SystemExit('LettersScreen target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # ReadingScreen: same four equal buttons; the existing writing board is untouched.
          p = Path('app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = '''                Row(Modifier.fillMaxWidth().height(50.dp), horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                    ReadingFormButton("أولي", form == ReadingLetterForm.INITIAL, Color(0xFF4C8BF5), Modifier.weight(1f)) { form = ReadingLetterForm.INITIAL; onTap() }
                    ReadingFormButton("وسطي", form == ReadingLetterForm.MEDIAL, Color(0xFFFFA726), Modifier.weight(1f)) { form = ReadingLetterForm.MEDIAL; onTap() }
                    ReadingFormButton("أخري", form == ReadingLetterForm.FINAL, Color(0xFF43A047), Modifier.weight(1f)) { form = ReadingLetterForm.FINAL; onTap() }
                }'''
          new = '''                Row(Modifier.fillMaxWidth().height(50.dp), horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                    ReadingFormButton("الحروف", false, Color(0xFF315CFF), Modifier.weight(1f)) { onTap() }
                    ReadingFormButton("أولي", form == ReadingLetterForm.INITIAL, Color(0xFF4C8BF5), Modifier.weight(1f)) { form = ReadingLetterForm.INITIAL; onTap() }
                    ReadingFormButton("وسطي", form == ReadingLetterForm.MEDIAL, Color(0xFFFFA726), Modifier.weight(1f)) { form = ReadingLetterForm.MEDIAL; onTap() }
                    ReadingFormButton("أخري", form == ReadingLetterForm.FINAL, Color(0xFF43A047), Modifier.weight(1f)) { form = ReadingLetterForm.FINAL; onTap() }
                }'''
          if old not in s:
              raise SystemExit('ReadingScreen target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # WritingStrokeLessonScreen: remove the duplicated letter strips and keep one four-button row.
          p = Path('app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''                if \(arabic && !numbers\) \{.*?                \} else if \(!arabic && !numbers\) \{''', re.S)
          replacement = '''                if (arabic && !numbers) {
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                        FormButton("الحروف", false, Color(0xFF315CFF), Modifier.weight(1f)) { replay++ }
                        FormButton("أولي", form == ArabicForm.INITIAL, Color(0xFF4C8BF5), Modifier.weight(1f)) { form = ArabicForm.INITIAL; replay++ }
                        FormButton("وسطي", form == ArabicForm.MEDIAL, Color(0xFFFFA726), Modifier.weight(1f)) { form = ArabicForm.MEDIAL; replay++ }
                        FormButton("أخري", form == ArabicForm.FINAL, Color(0xFF43A047), Modifier.weight(1f)) { form = ArabicForm.FINAL; replay++ }
                    }
                    Spacer(Modifier.height(4.dp))
                } else if (!arabic && !numbers) {'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('WritingStrokeLessonScreen target not found')
          p.write_text(s2, encoding='utf-8')

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          git rm .github/workflows/add-arabic-letter-selector.yml
          git commit -m "ui: add Arabic letters selector [arabic-selector]"
          git push origin HEAD:main
