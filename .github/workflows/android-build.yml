name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply offline audio migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager = Path('app/src/main/java/com/learnlettersnumbers/app/LocalAudioManager.kt')
          s = manager.read_text()
          s = s.replace(''' * The tested on-device embedded Android TTS voice is preferred for spoken\n * letters, numbers, introductions and encouragement. Existing bundled OGG\n * files are deliberately retained and remain the fallback if an offline\n * voice is unavailable. No network TTS is requested.''', ''' * The tested on-device embedded Android TTS voice is the only speech path.\n * No bundled legacy audio files and no network TTS are used.''')
          s = s.replace('''     * Plays a local resource name. For spoken educational content, the tested\n     * offline TTS voice is preferred; the old bundled file is retained as a\n     * fallback. This lets us test the new voice throughout the app safely.''', '''     * Resolves the educational resource name to text and speaks it with the\n     * tested offline Android TTS voice. Legacy bundled audio is not used.''')
          old = '''        val offline = offlineTextForResource(resourceName)\n        if (offline != null && speakOffline(offline.first, offline.second)) return true\n\n        stop()\n        val id = rawId(resourceName)\n        start(id, resourceName)\n        return true'''
          new = '''        val offline = offlineTextForResource(resourceName)\n        return offline != null && speakOffline(offline.first, offline.second)'''
          s = s.replace(old, new)
          old_seq = '''    fun playSequence(resourceNames: List<String>): Boolean {\n        if (!enabled || resourceNames.isEmpty()) return false\n        stop()\n        queue = resourceNames.map { rawId(it) }\n        queueIndex = 0\n        playQueueItem()\n        return true\n    }'''
          new_seq = '''    fun playSequence(resourceNames: List<String>): Boolean {\n        if (!enabled || resourceNames.isEmpty()) return false\n        val parts = resourceNames.mapNotNull { offlineTextForResource(it) }\n        if (parts.isEmpty()) return false\n        val language = parts.first().second\n        return speakOffline(parts.joinToString(" ") { it.first }, language)\n    }'''
          s = s.replace(old_seq, new_seq)
          manager.write_text(s)

          validator = Path('app/src/main/java/com/learnlettersnumbers/app/AudioCatalogValidator.kt')
          validator.write_text('''package com.learnlettersnumbers.app\n\nimport android.content.Context\n\n/** Audio validation for the offline TTS architecture. */\nobject AudioCatalogValidator {\n    fun validateOrThrow(context: Context) {\n        // Spoken content is generated by the installed offline Android TTS voice.\n    }\n}\n''')

          home = Path('app/src/main/java/com/learnlettersnumbers/app/HomeScreen.kt')
          h = home.read_text()
          h = re.sub(r'\n\s*LaunchedEffect\(Unit\)\{speak\("أهلاً بك في تطبيق تعلم الحروف والأرقام!"\)\}', '', h)
          home.write_text(h)

          main = Path('app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt')
          m = main.read_text()
          m = re.sub(r'\n\s*LaunchedEffect\(Unit\)\{speak\("أهلاً بك في قسم اللغة العربية\. هيا نتعلم معاً!"\)\}', '', m)
          m = re.sub(r'\n\s*LaunchedEffect\(Unit\)\{speak\("Hello! Welcome to the English section\. Let\'s learn together!"\)\}', '', m)
          m = re.sub(r'\n\s*LaunchedEffect\(Unit\)\{repo\.addStars\(1\);speak\("Welcome to English numbers\. Choose a number and listen!"\)\}', '\n        LaunchedEffect(Unit){repo.addStars(1)}', m)
          main.write_text(m)
          PY

          if [ -d app/src/main/res/raw ]; then
            find app/src/main/res/raw -type f \( -name '*.ogg' -o -name '*.mp3' -o -name '*.wav' \) -delete
          fi

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A app/src/main/java app/src/main/res
            git commit -m "Remove legacy audio and use offline TTS everywhere"
            git push
          fi

      - name: Apply games, rewards, and Arabic writing UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, new, 1), encoding='utf-8')
                  return True
              return False

          # Games: compact the header and make the grid visibly dominate the screen.
          p = 'app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt'
          changed = False
          changed |= replace_once(p, 'import androidx.compose.foundation.layout.*', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.rememberScrollState')
          changed |= replace_once(p, 'Card(Modifier.fillMaxWidth().padding(top = 8.dp), shape = RoundedCornerShape(28.dp)', 'Card(Modifier.fillMaxWidth().height(96.dp).padding(top = 4.dp), shape = RoundedCornerShape(24.dp)')
          old = '''Column(Modifier.padding(20.dp)) {\n                    Text("مستعد للتحدي؟ 🚀", fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)\n                    Spacer(Modifier.height(5.dp))\n                    Text("اختر لعبتك، افتح المستويات، اجمع النجوم، وابنِ سلسلة انتصاراتك!", fontSize = 15.sp)\n                    Spacer(Modifier.height(8.dp))\n                    Text("🏅 تقدمك: $completed / ${games.size * gameLevels.size} مراحل مكتملة", fontSize = 13.sp, fontWeight = FontWeight.Bold)\n                    if (dailyScore > 0) Text("🌟 أفضل نتيجة يومية: $dailyScore", fontSize = 13.sp, fontWeight = FontWeight.Bold)\n                }'''
          new = '''Row(Modifier.fillMaxSize().padding(horizontal = 14.dp), verticalAlignment = Alignment.CenterVertically) {\n                    Column(Modifier.weight(1f)) {\n                        Text("مستعد للتحدي؟ 🚀", fontSize = 21.sp, fontWeight = FontWeight.ExtraBold)\n                        Text("🏅 $completed / ${games.size * gameLevels.size} مراحل", fontSize = 12.sp, fontWeight = FontWeight.Bold)\n                    }\n                    if (dailyScore > 0) Text("🌟 $dailyScore", fontSize = 13.sp, fontWeight = FontWeight.Bold)\n                }'''
          changed |= replace_once(p, old, new)
          old = '''Text("اختر الفئة", fontSize = 17.sp, fontWeight = FontWeight.Bold)\n            Spacer(Modifier.height(6.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                categories.take(4).forEach { c -> FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 12.sp) }) }\n            }\n            Spacer(Modifier.height(6.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                categories.drop(4).forEach { c -> FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 12.sp) }) }\n            }'''
          new = '''Row(Modifier.fillMaxWidth().height(48.dp), verticalAlignment = Alignment.CenterVertically) {\n                Text("الفئة", fontSize = 14.sp, fontWeight = FontWeight.Bold)\n                Spacer(Modifier.width(6.dp))\n                Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                    categories.forEach { c -> FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 11.sp) }) }\n                }\n            }'''
          changed |= replace_once(p, old, new)
          old = '''Spacer(Modifier.height(10.dp))\n            Text("الألعاب", fontSize = 22.sp, fontWeight = FontWeight.Bold)\n            Spacer(Modifier.height(8.dp))'''
          new = '''Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                Text("الألعاب", fontSize = 20.sp, fontWeight = FontWeight.Bold)\n                Spacer(Modifier.weight(1f))\n                Text("اختر لعبة وابدأ 🎮", fontSize = 12.sp, fontWeight = FontWeight.Bold)\n            }\n            Spacer(Modifier.height(4.dp))'''
          changed |= replace_once(p, old, new)
          print('games changed:', changed)

          # Store: allow the entire page to scroll, including all 35 titles.
          p = 'app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt'
          changed = False
          changed |= replace_once(p, 'import androidx.compose.foundation.layout.*', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll')
          old = '''Column(\n            Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(MaterialTheme.colorScheme.background, MaterialTheme.colorScheme.surfaceVariant))).padding(14.dp)\n        ) {'''
          new = '''Column(\n            Modifier.fillMaxSize().verticalScroll(rememberScrollState()).background(Brush.verticalGradient(listOf(MaterialTheme.colorScheme.background, MaterialTheme.colorScheme.surfaceVariant))).padding(14.dp)\n        ) {'''
          changed |= replace_once(p, old, new)
          print('store changed:', changed)

          # Arabic writing: add a keyboard-like selector for all 28 letters.
          p = 'app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt'
          changed = False
          changed |= replace_once(p, 'import androidx.compose.foundation.layout.*', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.rememberScrollState')
          old = '''                    Spacer(Modifier.height(4.dp))\n                } else if (!arabic && !numbers) {'''
          new = '''                    Spacer(Modifier.height(4.dp))\n                    Text("الحروف", modifier = Modifier.fillMaxWidth(), fontSize = 14.sp, fontWeight = FontWeight.ExtraBold, textAlign = TextAlign.End)\n                    Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                        arLetters.forEachIndexed { i, letter ->\n                            Card(Modifier.size(42.dp).clickable { index = i; replay++ }, shape = RoundedCornerShape(11.dp), colors = CardDefaults.cardColors(containerColor = if (i == current) Color(0xFF4C8BF5) else Color.White), elevation = CardDefaults.cardElevation(if (i == current) 5.dp else 2.dp)) {\n                                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text(letter, fontSize = 20.sp, fontWeight = FontWeight.Black, color = if (i == current) Color.White else Color(0xFF315CFF)) }\n                            }\n                        }\n                    }\n                    Spacer(Modifier.height(4.dp))\n                } else if (!arabic && !numbers) {'''
          changed |= replace_once(p, old, new)
          print('writing changed:', changed)

          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
            git commit -m "Improve games rewards and Arabic writing selector"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
