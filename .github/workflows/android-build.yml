name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ env.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-upload.keystore"
          chmod 600 "$RUNNER_TEMP/release-upload.keystore"

      - name: Build signed release AAB
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-upload.keystore
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release AAB (unsigned fallback)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 == '' }}
        run: ./gradlew bundleRelease

      - name: Verify release artifact
        run: |
          ls -lh app/build/outputs/bundle/release/*.aab
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab >/dev/null
            echo "Signed release AAB verified."
          else
            echo "Release AAB built without release signing because signing secrets are not configured yet."
          fi

      - name: Prepare separate downloadable artifact folders
        run: |
          rm -rf android-artifacts
          mkdir -p android-artifacts/APK android-artifacts/Google-Play-AAB
          cp app/build/outputs/apk/debug/*.apk android-artifacts/APK/learn-letters-numbers-debug.apk
          cp app/build/outputs/bundle/release/*.aab android-artifacts/Google-Play-AAB/learn-letters-numbers-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android-artifacts/APK/learn-letters-numbers-debug.apk
          if-no-files-found: error

      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: google-play-aab
          path: android-artifacts/Google-Play-AAB/learn-letters-numbers-release.aab
          if-no-files-found: error
