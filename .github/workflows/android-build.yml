name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original local audio assets and audio routing
        shell: bash
        run: |
          set -e
          if [ ! -f app/src/main/res/raw/en_letter_01_sound.ogg ]; then
            git checkout 443d126f7e3025f647b5664e04b15db74ca376c9 -- app/src/main/res/raw
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/learnlettersnumbers/app/LocalAudioManager.kt')
          s = p.read_text()
          pattern = re.compile(r'    fun playRequired\(resourceName: String\): Boolean \{.*?\n    \}\n\n    fun playSequence\(resourceNames: List<String>\): Boolean \{.*?\n    \}', re.S)
          replacement = '''    fun playRequired(resourceName: String): Boolean {
          if (!enabled) return false

          // Prefer the original bundled recording. This is critical for isolated
          // English phonemes: Android TTS cannot reliably synthesize them.
          rawIdOrNull(resourceName)?.let { id ->
              stop()
              start(id, resourceName)
              return true
          }

          if (resourceName.matches(Regex("story_\\\\d{2}"))) {
              val index = resourceName.removePrefix("story_").toIntOrNull()
              if (index != null && speakStoryFromScreen(index)) return true
          }

          val offline = offlineTextForResource(resourceName)
          return offline != null && speakOffline(offline.first, offline.second)
      }

      fun playSequence(resourceNames: List<String>): Boolean {
          if (!enabled || resourceNames.isEmpty()) return false
          val ids = resourceNames.map { rawIdOrNull(it) }
          if (ids.all { it != null }) {
              stop()
              queue = ids.filterNotNull()
              queueIndex = 0
              playQueueItem()
              return true
          }
          val parts = resourceNames.mapNotNull { offlineTextForResource(it) }
          if (parts.isEmpty()) return false
          val language = parts.first().second
          return speakOffline(parts.joinToString(" ") { it.first }, language)
      }'''
          if not pattern.search(s):
              raise SystemExit('Audio functions pattern not found; refusing to modify source.')
          s = pattern.sub(replacement, s, count=1)
          marker = '    private fun rawId(name: String): Int {'
          helper = '''    private fun rawIdOrNull(name: String): Int? =
        context.resources.getIdentifier(name, "raw", context.packageName).takeIf { it != 0 }

'''
          if 'private fun rawIdOrNull' not in s:
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/raw app/src/main/java/com/learnlettersnumbers/app/LocalAudioManager.kt
            git commit -m "Restore original local letter audio and prefer recordings"
            git push
          else
            echo "Local audio assets already restored; no migration needed."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
