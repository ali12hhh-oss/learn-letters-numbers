name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-upload.keystore"
          chmod 600 "$RUNNER_TEMP/release-upload.keystore"

      - name: Build signed release AAB
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-upload.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release AAB (unsigned fallback)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        run: ./gradlew bundleRelease

      - name: Verify release artifact
        run: |
          ls -lh app/build/outputs/bundle/release/*.aab
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab >/dev/null
            echo "Signed release AAB verified."
          else
            echo "Release AAB built without release signing because signing secrets are not configured yet."
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
