name: Apply UI adjustments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[ui-adjustments]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UI files
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print(f'patched {path}: {s != original}')

          # Games: reduce the header footprint so the game grid occupies most of the screen.
          patch('app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt', [
              ('Card(Modifier.fillMaxWidth().padding(top = 8.dp), shape = RoundedCornerShape(28.dp)',
               'Card(Modifier.fillMaxWidth().height(96.dp).padding(top = 4.dp), shape = RoundedCornerShape(24.dp)'),
              ('Column(Modifier.padding(20.dp)) {\n                    Text("مستعد للتحدي؟ 🚀", fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)\n                    Spacer(Modifier.height(5.dp))\n                    Text("اختر لعبتك، افتح المستويات، اجمع النجوم، وابنِ سلسلة انتصاراتك!", fontSize = 15.sp)\n                    Spacer(Modifier.height(8.dp))\n                    Text("🏅 تقدمك: $completed / ${games.size * gameLevels.size} مراحل مكتملة", fontSize = 13.sp, fontWeight = FontWeight.Bold)\n                    if (dailyScore > 0) Text("🌟 أفضل نتيجة يومية: $dailyScore", fontSize = 13.sp, fontWeight = FontWeight.Bold)\n                }',
               'Row(Modifier.fillMaxSize().padding(horizontal = 14.dp), verticalAlignment = Alignment.CenterVertically) {\n                    Column(Modifier.weight(1f)) {\n                        Text("مستعد للتحدي؟ 🚀", fontSize = 21.sp, fontWeight = FontWeight.ExtraBold)\n                        Text("🏅 $completed / ${games.size * gameLevels.size} مراحل", fontSize = 12.sp, fontWeight = FontWeight.Bold)\n                    }\n                    if (dailyScore > 0) Text("🌟 $dailyScore", fontSize = 13.sp, fontWeight = FontWeight.Bold)\n                }'),
              ('Text("اختر الفئة", fontSize = 17.sp, fontWeight = FontWeight.Bold)\n            Spacer(Modifier.height(6.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                categories.take(4).forEach { c -> FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 12.sp) }) }\n            }\n            Spacer(Modifier.height(6.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                categories.drop(4).forEach { c -> FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 12.sp) }) }\n            }',
               'Row(Modifier.fillMaxWidth().height(48.dp), verticalAlignment = Alignment.CenterVertically) {\n                Text("الفئة", fontSize = 14.sp, fontWeight = FontWeight.Bold)\n                Spacer(Modifier.width(6.dp))\n                Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                    categories.forEach { c -> FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 11.sp) }) }\n                }\n            }'),
              ('Spacer(Modifier.height(10.dp))\n            Text("الألعاب", fontSize = 22.sp, fontWeight = FontWeight.Bold)\n            Spacer(Modifier.height(8.dp))',
               'Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                Text("الألعاب", fontSize = 20.sp, fontWeight = FontWeight.Bold)\n                Spacer(Modifier.weight(1f))\n                Text("اختر لعبة وابدأ 🎮", fontSize = 12.sp, fontWeight = FontWeight.Bold)\n            }\n            Spacer(Modifier.height(4.dp))'),
          ])

          # Reward store: make the complete store scrollable so all 35 titles are reachable.
          patch('app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt', [
              ('import androidx.compose.foundation.layout.*',
               'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll'),
              ('Column(\n            Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(MaterialTheme.colorScheme.background, MaterialTheme.colorScheme.surfaceVariant))).padding(14.dp)\n        ) {',
               'Column(\n            Modifier.fillMaxSize().verticalScroll(rememberScrollState()).background(Brush.verticalGradient(listOf(MaterialTheme.colorScheme.background, MaterialTheme.colorScheme.surfaceVariant))).padding(14.dp)\n        ) {'),
              ('modifier = Modifier.fillMaxWidth().height(620.dp),',
               'modifier = Modifier.fillMaxWidth().height(720.dp),'),
          ])

          # Arabic writing lesson: add the full Arabic keyboard-like letter selector with equal buttons.
          patch('app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt', [
              ('import androidx.compose.foundation.layout.*',
               'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.rememberScrollState'),
              ('                    Spacer(Modifier.height(4.dp))\n                } else if (!arabic && !numbers) {',
               '                    Spacer(Modifier.height(4.dp))\n                    Text("الحروف", modifier = Modifier.fillMaxWidth(), fontSize = 14.sp, fontWeight = FontWeight.ExtraBold, textAlign = TextAlign.End)\n                    Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                        arLetters.forEachIndexed { i, letter ->\n                            Card(Modifier.size(42.dp).clickable { index = i; replay++ }, shape = RoundedCornerShape(11.dp), colors = CardDefaults.cardColors(containerColor = if (i == current) Color(0xFF4C8BF5) else Color.White), elevation = CardDefaults.cardElevation(if (i == current) 5.dp else 2.dp)) {\n                                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text(letter, fontSize = 20.sp, fontWeight = FontWeight.Black, color = if (i == current) Color.White else Color(0xFF315CFF)) }\n                            }\n                        }\n                    }\n                    Spacer(Modifier.height(4.dp))\n                } else if (!arabic && !numbers) {'),
          ])

      - name: Commit UI adjustments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt .github/workflows/apply-ui-adjustments.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ui: apply games rewards and Arabic letter selector [ui-adjustments]"
          git push origin HEAD:main
