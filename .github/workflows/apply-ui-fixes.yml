name: Apply UI fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ui-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI changes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # Games: remove the large intro block, compress filters into one horizontal row,
          # and give the game grid the dominant vertical space.
          p = root/'app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt'
          s = p.read_text()
          intro = re.compile(r'\n\s*Card\(Modifier\.fillMaxWidth\(\)\.padding\(top = 8\.dp\).*?\n\s*}\n\s*Spacer\(Modifier\.height\(10\.dp\)\)', re.S)
          s2 = intro.sub('\n            Spacer(Modifier.height(4.dp))', s, count=1)
          filters = re.compile(r'\n\s*Text\("اختر الفئة".*?\n\s*Text\("الألعاب", fontSize = 22\.sp, fontWeight = FontWeight\.Bold\)', re.S)
          replacement = '''
            androidx.compose.foundation.lazy.LazyRow(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.spacedBy(6.dp),
                contentPadding = PaddingValues(horizontal = 2.dp)
            ) {
                items(categories) { c ->
                    FilterChip(selected = category == c, onClick = { category = c }, label = { Text(c, fontSize = 12.sp) })
                }
            }
            Spacer(Modifier.height(5.dp))
            Text("الألعاب", fontSize = 20.sp, fontWeight = FontWeight.Bold)'''
          s2 = filters.sub(replacement, s2, count=1)
          s2 = s2.replace('Modifier.weight(1f).fillMaxWidth()', 'Modifier.weight(1f).fillMaxWidth()')
          s2 = s2.replace('.height(180.dp).scale(scale)', '.height(205.dp).scale(scale)')
          if s2 != s:
              p.write_text(s2)

          # Store: ensure titles are visibly part of the single rewards screen and both
          # sections have bounded space so the titles are not pushed below an unbounded grid.
          p = root/'app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt'
          s = p.read_text()
          s = s.replace('modifier = Modifier.fillMaxWidth(),\n                verticalArrangement = Arrangement.spacedBy(9.dp)', 'modifier = Modifier.fillMaxWidth().height(330.dp),\n                verticalArrangement = Arrangement.spacedBy(9.dp)', 1)
          s = s.replace('modifier = Modifier.fillMaxWidth(),\n                verticalArrangement = Arrangement.spacedBy(7.dp)', 'modifier = Modifier.fillMaxWidth().height(620.dp),\n                verticalArrangement = Arrangement.spacedBy(7.dp)', 1)
          s = s.replace('Text("🎁 المكافآت", fontSize = 23.sp, fontWeight = FontWeight.Black)', 'Text("🎁 المكافآت والألقاب", fontSize = 23.sp, fontWeight = FontWeight.Black)')
          if s != p.read_text():
              p.write_text(s)

          # Arabic letters: add a compact keyboard-like strip, preserving the existing
          # initial/medial/final controls.
          p = root/'app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt'
          s = p.read_text()
          marker = 'Spacer(Modifier.height(10.dp))\n                Box(Modifier.fillMaxWidth().weight(1f)'
          keyboard = '''Spacer(Modifier.height(7.dp))
                Text("الحروف", fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
                androidx.compose.foundation.lazy.LazyRow(
                    modifier = Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.spacedBy(5.dp),
                    contentPadding = PaddingValues(horizontal = 2.dp)
                ) {
                    items(arabicLetters.size) { i ->
                        val item = arabicLetters[i]
                        Box(
                            Modifier.size(44.dp).background(item.color.copy(alpha = .16f), RoundedCornerShape(12.dp))
                                .clickable { index = i; onTap() },
                            contentAlignment = Alignment.Center
                        ) { Text(item.letter, fontSize = 21.sp, fontWeight = FontWeight.Black, color = item.color) }
                    }
                }
                Spacer(Modifier.height(7.dp))
                Box(Modifier.fillMaxWidth().weight(1f)'''
          if marker in s:
              s = s.replace(marker, keyboard, 1)
          p.write_text(s)

          # Home: center A B C mathematically inside its circular badge.
          p = root/'app/src/main/java/com/learnlettersnumbers/app/HomeScreen.kt'
          s = p.read_text()
          old = 'Text(icon,fontSize=24.sp,fontWeight=FontWeight.Black,color=Color.White)'
          new = 'Text(icon,modifier=Modifier.fillMaxSize(),fontSize=24.sp,fontWeight=FontWeight.Black,color=Color.White,textAlign=TextAlign.Center)'
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt app/src/main/java/com/learnlettersnumbers/app/HomeScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Improve games store Arabic letters and home UI"
          git push
