name: Apply Writing Layout

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update English writing screen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          marker = 'WRITING_LAYOUT_V2'
          if marker in text:
              print('Writing layout already applied')
              raise SystemExit(0)

          start = text.index('    @Composable\n    fun EnglishWriting(')
          end = text.index('    @Composable\n    private fun LetterCaseChoice', start)

          new_function = r'''    @Composable
    fun EnglishWriting(onBack: () -> Unit, speak: (String) -> Unit, repo: ProgressRepository) {
        var mode by remember { mutableStateOf("letters") }
        var index by remember { mutableStateOf(0) }
        var selectedCase by remember { mutableStateOf("upper") }
        var inkColor by remember { mutableStateOf(Color(0xFF2563EB)) }
        val strokes = remember { mutableStateListOf<List<Offset>>() }
        var currentStroke by remember { mutableStateOf<List<Offset>>(emptyList()) }
        val letters = ('A'..'Z').map { it.toString() }
        val total = if (mode == "letters") 26 else 100
        val baseLetter = letters[index.coerceIn(0, letters.lastIndex)][0]
        val target = if (mode == "letters") {
            if (selectedCase == "upper") baseLetter.toString() else baseLetter.lowercase()
        } else (index + 1).toString()

        LaunchedEffect(Unit) { repo.addStars(1) }

        fun clearBoard() { strokes.clear(); currentStroke = emptyList() }
        fun speakTarget() {
            if (mode == "letters") speak(englishLetterSound(baseLetter)) else speak(numberName(index + 1))
        }
        LaunchedEffect(mode, index, selectedCase) { clearBoard(); speakTarget() }

        Column(
            Modifier.fillMaxSize()
                .background(Brush.verticalGradient(listOf(Color(0xFFE9F8FF), Color(0xFFFFF1D7))))
                .padding(horizontal = 10.dp, vertical = 5.dp)
        ) {
            Row(Modifier.fillMaxWidth().height(48.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                Button(onClick = onBack, shape = RoundedCornerShape(16.dp)) { Text("Back") }
                Text("Writing", fontSize = 28.sp, fontWeight = FontWeight.ExtraBold, color = Color(0xFF2357A6))
            }

            Row(Modifier.fillMaxWidth().height(54.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                ModeButton("Letters", "الحروف", mode == "letters", Color(0xFF4C8BF5), Modifier.weight(1f)) { mode = "letters"; index = 0; selectedCase = "upper" }
                ModeButton("Numbers", "الأرقام", mode == "numbers", Color(0xFFFF8A4C), Modifier.weight(1f)) { mode = "numbers"; index = 0 }
            }

            if (mode == "letters") {
                Row(Modifier.fillMaxWidth().padding(vertical = 5.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    LetterCaseChoice(letter = baseLetter.toString(), title = "UPPERCASE", arabic = "حرف كبير", selected = selectedCase == "upper", color = Color(0xFF4C8BF5), modifier = Modifier.weight(1f)) { selectedCase = "upper"; speak("Capital letter ${baseLetter}") }
                    LetterCaseChoice(letter = baseLetter.lowercase(), title = "lowercase", arabic = "حرف صغير", selected = selectedCase == "lower", color = Color(0xFFFF8A4C), modifier = Modifier.weight(1f)) { selectedCase = "lower"; speak("Small letter ${baseLetter.lowercase()}") }
                }
            }

            Row(Modifier.fillMaxWidth().height(46.dp), horizontalArrangement = Arrangement.Center, verticalAlignment = Alignment.CenterVertically) {
                Text(if (mode == "letters") "${index + 1} / 26" else "${index + 1} / 100", fontWeight = FontWeight.ExtraBold, fontSize = 13.sp)
                Spacer(Modifier.width(10.dp))
                Text(target, fontSize = 34.sp, fontWeight = FontWeight.Black, color = Color(0xFF2357A6))
                Spacer(Modifier.width(8.dp))
                IconButton(onClick = { speakTarget() }) { Text("🔊", fontSize = 22.sp) }
            }

            Card(Modifier.fillMaxWidth().weight(1f), shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), elevation = CardDefaults.cardElevation(9.dp)) {
                Column(Modifier.fillMaxSize().padding(6.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                    val boardModifier = Modifier.fillMaxWidth().weight(1f).background(Color(0xFFFDFEFF), RoundedCornerShape(20.dp)).pointerInput(inkColor) {
                        detectDragGestures(
                            onDragStart = { currentStroke = listOf(it) },
                            onDrag = { change, _ -> change.consume(); currentStroke = currentStroke + change.position },
                            onDragEnd = { if (currentStroke.isNotEmpty()) strokes.add(currentStroke); currentStroke = emptyList() },
                            onDragCancel = { currentStroke = emptyList() }
                        )
                    }
                    Canvas(boardModifier) {
                        val all = strokes + listOf(currentStroke)
                        all.forEach { pts ->
                            if (pts.size > 1) {
                                val path = Path().apply { moveTo(pts[0].x, pts[0].y); for (i in 1 until pts.size) lineTo(pts[i].x, pts[i].y) }
                                drawPath(path, inkColor, style = androidx.compose.ui.graphics.drawscope.Stroke(width = 12f, cap = StrokeCap.Round, join = StrokeJoin.Round))
                            }
                        }
                    }
                    Row(Modifier.fillMaxWidth().height(42.dp), horizontalArrangement = Arrangement.Center, verticalAlignment = Alignment.CenterVertically) {
                        val colors = listOf(Color(0xFF2563EB), Color(0xFF16A34A), Color(0xFFE11D48), Color(0xFF9333EA), Color(0xFFF59E0B))
                        colors.forEach { c ->
                            Box(Modifier.padding(4.dp).size(32.dp).background(c, CircleShape).clickable { inkColor = c })
                        }
                    }
                }
            }

            Spacer(Modifier.height(5.dp))
            Row(Modifier.fillMaxWidth().height(56.dp), horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                OutlinedButton(onClick = { if (index > 0) index-- }, enabled = index > 0, modifier = Modifier.weight(1f)) { Text("Previous") }
                Button(onClick = { clearBoard(); repo.recordWritingPractice() }, modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFE85D9E))) { Text("Clear") }
                Button(onClick = { repo.recordWritingPractice(); if (index < total - 1) index++ else { repo.recordLesson("English writing", target, true); repo.addStars(1) } }, modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF4C8BF5))) { Text("Next") }
            }
        }
        // WRITING_LAYOUT_V2
    }
'''

          text = text[:start] + new_function + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit layout change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix English writing board layout"
          git push

      - name: Trigger Android build
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/ali12hhh-oss/learn-letters-numbers/actions/workflows/android-build.yml/dispatches \
            -d '{"ref":"main"}'
