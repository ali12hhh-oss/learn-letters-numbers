name: Direct Source Fix

on:
  push:
    branches: [ feature/pro-games ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix GamesScreen compile errors
        shell: python
        run: |
          from pathlib import Path

          games = Path("app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt")
          s = games.read_text(encoding="utf-8")

          if not s.startswith("@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"):
              s = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n" + s

          s = s.replace("import androidx.compose.material.icons.filled.VolumeUp", "import androidx.compose.material.icons.filled.PlayArrow")
          s = s.replace("Icons.Default.VolumeUp", "Icons.Default.PlayArrow")
          games.write_text(s, encoding="utf-8")

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes were needed"
            exit 0
          fi
          git commit -m "Fix games screen compilation errors"
          git push

      - name: Remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/direct-source-fix.yml
          git add .github/workflows/direct-source-fix.yml
          git commit -m "Remove one-time games source fix workflow"
          git push
