name: Direct Source Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/direct-source-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix source files directly
        shell: python
        run: |
          from pathlib import Path

          letters = Path("app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt")
          s = letters.read_text(encoding="utf-8")
          s = s.replace("ArabicArabicLetterForm", "ArabicLetterForm")
          letters.write_text(s, encoding="utf-8")

          reading = Path("app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt")
          s = reading.read_text(encoding="utf-8")

          old_reading = '''val ids: List<Int> = word.mapNotNull { ch ->\n                        readingArabicLetters.indexOf(ch).takeIf { it >= 0 }?.plus(1)\n                    }'''
          new_reading = '''val ids: List<Int> = word.map { ch: Char ->\n                        readingArabicLetters.indexOf(ch) + 1\n                    }'''
          s = s.replace(old_reading, new_reading)

          old_arabic = '''val ids: List<Int> = word.mapNotNull { ch ->\n                                        arabicLetters.indexOf(ch).takeIf { it >= 0 }?.plus(1)\n                                    }'''
          new_arabic = '''val ids: List<Int> = word.map { ch: Char ->\n                                        arabicLetters.indexOf(ch) + 1\n                                    }'''
          s = s.replace(old_arabic, new_arabic)

          s = s.replace("if (ids.size == word.length) {", "if (ids.all { it in 1..28 }) {")
          reading.write_text(s, encoding="utf-8")

          games = Path("app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt")
          s = games.read_text(encoding="utf-8")
          s = s.replace('import androidx.compose.material.icons.filled.EmojiEvents\n', '')
          s = s.replace('import androidx.compose.material.icons.filled.VolumeUp\n', '')
          s = s.replace('import androidx.compose.material.icons.filled.CheckCircle\n', '')
          s = s.replace('Icon(Icons.Default.EmojiEvents, null, tint = MaterialTheme.colorScheme.primary)', 'Text("🏆", fontSize = 24.sp)')
          s = s.replace('Icon(Icons.Default.VolumeUp, null)', 'Text("🔊", fontSize = 20.sp)')
          games.write_text(s, encoding="utf-8")

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes were needed"
            exit 0
          fi
          git commit -m "Fix remaining Kotlin source errors"
          git push

      - name: Remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/direct-source-fix.yml
          git add .github/workflows/direct-source-fix.yml
          git commit -m "Remove one-time source fix workflow"
          git push
