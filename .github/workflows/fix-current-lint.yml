name: Fix current lint sources

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-current-lint.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify expected source patterns
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BoxWithConstraints(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          grep -F 'import androidx.compose.ui.input.pointer.consumePositionChange' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          grep -F 'change.consumePositionChange()' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt'): [
                  ('BoxWithConstraints(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {',
                   'Box(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {'),
              ],
              Path('app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt'): [
                  ('import androidx.compose.ui.input.pointer.consumePositionChange',
                   'import androidx.compose.ui.input.pointer.consume'),
                  ('change.consumePositionChange()', 'change.consume()'),
              ],
              Path('app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt'): [
                  ('import androidx.compose.material.icons.filled.ArrowBack',
                   'import androidx.compose.material.icons.automirrored.filled.ArrowBack'),
                  ('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack'),
              ],
              Path('app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt'): [
                  ('import androidx.compose.material.icons.filled.ArrowBack',
                   'import androidx.compose.material.icons.automirrored.filled.ArrowBack'),
                  ('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack'),
              ],
              Path('app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt'): [
                  ('import androidx.compose.material.icons.filled.ArrowBack',
                   'import androidx.compose.material.icons.automirrored.filled.ArrowBack'),
                  ('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly 1 occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source fixes before commit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'BoxWithConstraints(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          ! grep -F 'import androidx.compose.ui.input.pointer.consumePositionChange' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          ! grep -F 'change.consumePositionChange()' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          ! grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          ! grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          ! grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          ! grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          ! grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          ! grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          grep -F 'Box(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          grep -F 'import androidx.compose.ui.input.pointer.consume' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          grep -F 'change.consume()' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          git diff --check
          git diff -- app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt

      - name: Validate with Gradle
        shell: bash
        run: |
          ./gradlew lintDebug

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt \
            app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt \
            app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt \
            app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt \
            app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          git commit -m 'Fix current lint errors and deprecated APIs'
          git push

      - name: Remove this one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-current-lint.yml
          git commit -m 'Remove one-time lint fixer'
          git push

# Triggered once from main after the source audit.