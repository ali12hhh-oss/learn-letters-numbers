name: Fix GamesScreen build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix LazyRow items overload
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/learnlettersnumbers/app/GamesScreen.kt")
          s = p.read_text()
          old = "import androidx.compose.foundation.lazy.grid.items\n"
          if "import androidx.compose.foundation.lazy.items as lazyItems\n" not in s:
              s = s.replace(old, old + "import androidx.compose.foundation.lazy.items as lazyItems\n", 1)
          s = s.replace("      items(categories) { c ->", "      lazyItems(categories) { c ->", 1)
          p.write_text(s)
          PY
          git diff --check
          if git diff --quiet -- "$FILE"; then
            echo "No GamesScreen change needed."
            rm -f .github/workflows/fix-games-build.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/fix-games-build.yml
            git commit -m "chore: remove temporary games build fixer" || true
            git push
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "fix: resolve GamesScreen LazyRow items overload"
          git push
          rm -f .github/workflows/fix-games-build.yml
          git add .github/workflows/fix-games-build.yml
          git commit -m "chore: remove temporary games build fixer"
          git push
