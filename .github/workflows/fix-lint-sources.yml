name: Fix Lint Sources (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify expected source before editing
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          test -f app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          test -f app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          test -f app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          test -f app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt

          grep -F 'BoxWithConstraints(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          grep -F 'consumePositionChange' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt': [
                  ('BoxWithConstraints(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {',
                   'Box(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {'),
              ],
              'app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt': [
                  ('import androidx.compose.ui.input.pointer.consumePositionChange',
                   'import androidx.compose.ui.input.pointer.consume'),
                  ('change.consumePositionChange()', 'change.consume()'),
              ],
              'app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt': [
                  ('import androidx.compose.material.icons.filled.ArrowBack',
                   'import androidx.compose.material.icons.automirrored.filled.ArrowBack'),
                  ('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack'),
              ],
              'app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt': [
                  ('import androidx.compose.material.icons.filled.ArrowBack',
                   'import androidx.compose.material.icons.automirrored.filled.ArrowBack'),
                  ('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack'),
              ],
              'app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt': [
                  ('import androidx.compose.material.icons.filled.ArrowBack',
                   'import androidx.compose.material.icons.automirrored.filled.ArrowBack'),
                  ('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack'),
              ],
          }

          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'MISSING_EXPECTED_PATTERN: {name}: {old!r}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'NO_CHANGE: {name}')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify source after editing
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'BoxWithConstraints(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          ! grep -F 'consumePositionChange' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          ! grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          ! grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          ! grep -F 'import androidx.compose.material.icons.filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          ! grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          ! grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          ! grep -F 'Icons.Default.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          grep -F 'Icons.AutoMirrored.Filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt
          grep -F 'Icons.AutoMirrored.Filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt
          grep -F 'Icons.AutoMirrored.Filled.ArrowBack' app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          grep -F 'change.consume()' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          git diff --check

      - name: Verify by compiling and running lint
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13
          fi
          ./gradlew lintDebug

      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt \
                  app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt \
                  app/src/main/java/com/learnlettersnumbers/app/StagesScreen.kt \
                  app/src/main/java/com/learnlettersnumbers/app/WritingStrokeLessonScreen.kt \
                  app/src/main/java/com/learnlettersnumbers/app/WritingTutorialScreen.kt
          git diff --cached --check
          git diff --cached --stat
          git diff --cached
          git commit -m 'Fix verified Compose lint errors and deprecations'
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-lint-sources.yml
          git commit -m 'Remove one-time lint fix workflow'
          git push
