name: Fix Arabic numbers practice navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[practice-nav]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply practice navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/learnlettersnumbers/app/NumbersScreen.kt')
          s = p.read_text(encoding='utf-8')

          old = '''            NumberMode.PRACTICE->{Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(10.dp)){OperationButton("جمع +",operation==OperationMode.ADD,Modifier.weight(1f),Color(0xFF2EAD69)){operation=OperationMode.ADD;practiceSeed++;selectedAnswer=null;practiceAnswered=false;onTap()};OperationButton("طرح −",operation==OperationMode.SUBTRACT,Modifier.weight(1f),Color(0xFFE85D5D)){operation=OperationMode.SUBTRACT;practiceSeed++;selectedAnswer=null;practiceAnswered=false;onTap()}};Spacer(Modifier.height(10.dp));PracticeCard(practice,selectedAnswer,practiceAnswered,onSpeak={if(soundsEnabled()){val op=if(practice.add)"زائد" else "ناقص";audio.speakOffline("${numberWords(practice.a)} $op ${numberWords(practice.b)} يساوي كم؟ خذ وقتك وفكر ثم اختر الإجابة.","ar")}},onAnswer={answer->if(!practiceAnswered){selectedAnswer=answer;practiceAnswered=true;repo.recordAnswer(answer==practice.result);if(answer==practice.result)repo.addStars(1);if(soundsEnabled())audio.speakOffline(if(answer==practice.result)"أحسنت! إجابة صحيحة." else "حاول مرة أخرى. الإجابة الصحيحة هي ${numberWords(practice.result)}.","ar")}},onNext={practiceSeed++;selectedAnswer=null;practiceAnswered=false;onTap()})}'''
          new = '''            NumberMode.PRACTICE->{Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(10.dp)){OperationButton("جمع +",operation==OperationMode.ADD,Modifier.weight(1f),Color(0xFF2EAD69)){operation=OperationMode.ADD;practiceSeed=1;selectedAnswer=null;practiceAnswered=false;onTap()};OperationButton("طرح −",operation==OperationMode.SUBTRACT,Modifier.weight(1f),Color(0xFFE85D5D)){operation=OperationMode.SUBTRACT;practiceSeed=1;selectedAnswer=null;practiceAnswered=false;onTap()}};Spacer(Modifier.height(10.dp));PracticeCard(practice,selectedAnswer,practiceAnswered,onSpeak={if(soundsEnabled()){val op=if(practice.add)"زائد" else "ناقص";audio.speakOffline("${numberWords(practice.a)} $op ${numberWords(practice.b)} يساوي كم؟ خذ وقتك وفكر ثم اختر الإجابة.","ar")}},onAnswer={answer->if(!practiceAnswered){selectedAnswer=answer;practiceAnswered=true;repo.recordAnswer(answer==practice.result);if(answer==practice.result)repo.addStars(1);if(soundsEnabled())audio.speakOffline(if(answer==practice.result)"أحسنت! إجابة صحيحة." else "حاول مرة أخرى. الإجابة الصحيحة هي ${numberWords(practice.result)}.","ar")}},onNext={practiceSeed++;selectedAnswer=null;practiceAnswered=false;onTap()},onPrevious={if(practiceSeed>1){practiceSeed--;selectedAnswer=null;practiceAnswered=false;onTap()}})}'''
          if old not in s:
              raise SystemExit('Practice parent block not found')
          s = s.replace(old, new, 1)

          old_sig = '''@Composable private fun PracticeCard(example:OperationExample,answer:Int?,answered:Boolean,onSpeak:()->Unit,onAnswer:(Int)->Unit,onNext:()->Unit)'''
          new_sig = '''@Composable private fun PracticeCard(example:OperationExample,answer:Int?,answered:Boolean,onSpeak:()->Unit,onAnswer:(Int)->Unit,onNext:()->Unit,onPrevious:()->Unit)'''
          if old_sig not in s:
              raise SystemExit('PracticeCard signature not found')
          s = s.replace(old_sig, new_sig, 1)

          old_tail = ''';if(answered){Spacer(Modifier.height(12.dp));Text(if(answer==example.result)"أحسنت! إجابة صحيحة ⭐" else "الإجابة الصحيحة: ${arabicDigits(example.result)}",fontSize=19.sp,fontWeight=FontWeight.Black,color=if(answer==example.result)Color(0xFF2E7D32) else Color(0xFFC62828),textAlign=TextAlign.Center);Spacer(Modifier.height(8.dp));Number3DButton("السؤال التالي ➜",Color(0xFF7E57C2),Modifier.fillMaxWidth(),onNext)}}}'''
          new_tail = ''';if(answered){Spacer(Modifier.height(12.dp));Text(if(answer==example.result)"أحسنت! إجابة صحيحة ⭐" else "الإجابة الصحيحة: ${arabicDigits(example.result)}",fontSize=19.sp,fontWeight=FontWeight.Black,color=if(answer==example.result)Color(0xFF2E7D32) else Color(0xFFC62828),textAlign=TextAlign.Center)};Spacer(Modifier.height(14.dp));Row(Modifier.fillMaxWidth().height(58.dp),horizontalArrangement=Arrangement.spacedBy(10.dp)){NumberNavigationButton("السؤال السابق",example.a>0,Color(0xFF7E57C2),Modifier.weight(1f),onPrevious);NumberNavigationButton("سؤال جديد",true,Color(0xFF039BE5),Modifier.weight(1f),onNext)}}}'''
          if old_tail not in s:
              raise SystemExit('PracticeCard navigation tail not found')
          s = s.replace(old_tail, new_tail, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/NumbersScreen.kt
          git rm .github/workflows/fix-practice-navigation.yml
          git commit -m "ui: add Arabic practice question navigation [practice-nav]"
          git push origin HEAD:main
