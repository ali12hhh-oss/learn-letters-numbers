name: Fix source errors once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified source fixes
        shell: python
        run: |
          from pathlib import Path

          base = Path("app/src/main/java/com/learnlettersnumbers/app")

          letters = base / "LettersScreen.kt"
          s = letters.read_text(encoding="utf-8")
          before = s
          bad = "ArabicArabicLetterForm"
          good = "ArabicLetterForm"
          count = s.count(bad)
          if count != 3:
              raise SystemExit(f"LettersScreen.kt: expected exactly 3 malformed references, found {count}")
          s = s.replace(bad, good)
          if s.count(bad) != 0:
              raise SystemExit("LettersScreen.kt: malformed enum references remain after replacement")
          if s.count(good) < 6:
              raise SystemExit("LettersScreen.kt: expected ArabicLetterForm references are missing")
          if s == before:
              raise SystemExit("LettersScreen.kt: no change was made")
          letters.write_text(s, encoding="utf-8")

          reading = base / "ReadingScreen.kt"
          s = reading.read_text(encoding="utf-8")
          before = s

          old1 = '''val ids: List<Int> = word.mapNotNull { ch ->\n                        readingArabicLetters.indexOf(ch).takeIf { it >= 0 }?.plus(1)\n                    }'''
          new1 = '''val ids: List<Int> = word.mapNotNull { ch: Char ->\n                        readingArabicLetters.indexOf(ch.toString()).takeIf { it >= 0 }?.plus(1)\n                    }'''
          old2 = '''val ids: List<Int> = word.mapNotNull { ch ->\n                                        arabicLetters.indexOf(ch).takeIf { it >= 0 }?.plus(1)\n                                    }'''
          new2 = '''val ids: List<Int> = word.mapNotNull { ch: Char ->\n                                        arabicLetters.indexOfFirst { it.letter == ch.toString() }.takeIf { it >= 0 }?.plus(1)\n                                    }'''

          if s.count(old1) != 1:
              raise SystemExit(f"ReadingScreen.kt: expected one first audio-index expression, found {s.count(old1)}")
          if s.count(old2) != 1:
              raise SystemExit(f"ReadingScreen.kt: expected one second audio-index expression, found {s.count(old2)}")

          s = s.replace(old1, new1).replace(old2, new2)
          if s == before:
              raise SystemExit("ReadingScreen.kt: no source change was made")
          reading.write_text(s, encoding="utf-8")

          print("Verified source edits:")
          print(" - LettersScreen.kt: 3 malformed enum references fixed")
          print(" - ReadingScreen.kt: both Char-to-letter index lookups fixed with explicit types")

      - name: Verify exact edits before commit
        shell: bash
        run: |
          test "$(grep -o 'ArabicArabicLetterForm' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt | wc -l)" -eq 0
          test "$(grep -o 'ArabicLetterForm.INITIAL' app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt | wc -l)" -ge 2
          grep -F 'readingArabicLetters.indexOf(ch.toString())' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt >/dev/null
          grep -F 'arabicLetters.indexOfFirst { it.letter == ch.toString() }' app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt >/dev/null

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt app/src/main/java/com/learnlettersnumbers/app/ReadingScreen.kt
          git diff --cached --check
          git commit -m "Fix real Kotlin source errors in letters and reading screens"
          git push
