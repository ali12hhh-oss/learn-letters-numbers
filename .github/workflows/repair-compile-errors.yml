name: Repair Kotlin Compile Errors

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: hashFiles('tools/repair_compile_errors.py') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply compile-only repairs
        run: python tools/repair_compile_errors.py

      - name: Commit repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app
          git commit -m "Fix Kotlin compile errors without changing features"
          git push

      - name: Remove one-time repair helper
        run: |
          rm -f tools/repair_compile_errors.py .github/workflows/repair-compile-errors.yml
          git add -u tools/repair_compile_errors.py .github/workflows/repair-compile-errors.yml
          git commit -m "Remove one-time repair helper"
          git push
