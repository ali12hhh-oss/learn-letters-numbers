name: Restore MainActivity safely

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good MainActivity and patch only rewards route
        run: |
          git checkout 98074ca77a996cce986cc2c513e3a53c65326aef -- app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '"rewards" -> RewardStoreScreen(repo=progressRepo,onBack={screen=settingsReturnScreen},speak={speakArabic(it)})'
          new = '''"rewards" -> RewardStoreScreen(repo=progressRepo,onBack={screen=settingsReturnScreen},speak={text ->
                      if (settingsRepo.soundsEnabled()) localAudio.speakOffline(text, "ar")
                      if (settingsRepo.effectsEnabled()) tone?.startTone(ToneGenerator.TONE_PROP_BEEP, 70)
                  })'''
          if old not in s:
              raise SystemExit('rewards route not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt
          git commit -m "Restore MainActivity and fix rewards voice routing"
          git push
          rm -f .github/workflows/restore-mainactivity.yml
          git add -u .github/workflows/restore-mainactivity.yml
          git commit -m "Remove one-time restore workflow"
          git push
