name: Temporary Arabic Letters UI Fix

on:
  push:
    paths:
      - '.github/workflows/ui-arabic-letters-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Arabic letters UI changes
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt')
          s = p.read_text(encoding='utf-8')

          # Remove the letter-selection grid that appears above the main display.
          pattern = r'\n            LazyVerticalGrid\(\n                columns = GridCells\.Fixed\(7\),.*?\n            \}\n\n            Spacer\(Modifier\.height\(8\.dp\)\)'
          s2, count = re.subn(pattern, '\n            Spacer(Modifier.height(8.dp))', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one Arabic letter grid block, found {count}')
          s = s2

          # Make the previous/next controls larger and place them below the main display.
          marker = '''            Spacer(Modifier.height(10.dp))\n            Row(Modifier.fillMaxWidth().height(110.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {'''
          replacement = '''            Spacer(Modifier.height(10.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp)) {\n                Button(\n                    onClick = { if (index > 0) { index--; onTap() } },\n                    enabled = index > 0,\n                    modifier = Modifier.weight(1f).height(58.dp),\n                    shape = RoundedCornerShape(18.dp)\n                ) {\n                    Text("السابق", fontSize = 19.sp, fontWeight = FontWeight.ExtraBold)\n                }\n                Button(\n                    onClick = { if (index < arabicLetters.lastIndex) { index++; onTap() } },\n                    enabled = index < arabicLetters.lastIndex,\n                    modifier = Modifier.weight(1f).height(58.dp),\n                    shape = RoundedCornerShape(18.dp)\n                ) {\n                    Text("التالي", fontSize = 19.sp, fontWeight = FontWeight.ExtraBold)\n                }\n            }\n\n            Spacer(Modifier.height(10.dp))\n            Row(Modifier.fillMaxWidth().height(110.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {'''
          if marker not in s:
              raise SystemExit('Navigation insertion marker not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/learnlettersnumbers/app/LettersScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Arabic letters navigation UI'
          git push
