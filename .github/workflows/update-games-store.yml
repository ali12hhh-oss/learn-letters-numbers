name: Restore targeted store fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore MainActivity and apply only the store audio route
        run: |
          git checkout 98074ca77a996cce986cc2c513e3a53c65326aef -- app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '"rewards" -> RewardStoreScreen(repo=progressRepo,onBack={screen=settingsReturnScreen},speak={speakArabic(it)})'
          new = '''"rewards" -> RewardStoreScreen(repo=progressRepo,onBack={screen=settingsReturnScreen},speak={text ->
                      if (settingsRepo.soundsEnabled()) localAudio.speakOffline(text, "ar")
                      if (settingsRepo.effectsEnabled()) tone?.startTone(ToneGenerator.TONE_PROP_BEEP, 70)
                  })'''
          if old not in s:
              raise SystemExit('Expected rewards route not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Restore RewardStore and make phrases appropriate
        run: |
          git checkout e6007d6243b22afa8c1a1a9d8a81d8a225df76ca -- app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('speak("أهلاً بك! مرحباً بك في متجر المكافآت. هيا نختار مكافآت رائعة!")', 'speak("أهلاً بك في متجر المكافآت! هيا نتعلم ونكافئ أنفسنا.")')
          s = s.replace('speak("أحسنت! لقد اشتريت ${item.title}. استمتع بمكافأتك!")', 'speak("أحسنت! لقد حصلت على ${item.title}. استمتع بمكافأتك!")')
          s = s.replace('speak("تحتاج إلى المزيد من النجوم لشراء هذه المكافأة.")', 'speak("لا توجد نجوم كافية لشراء هذه المكافأة. اجمع المزيد من النجوم وحاول مرة أخرى!")')
          s = s.replace('speak("مبروك! حصلت على لقب $title. أنت رائع!")', 'speak("أحسنت! حصلت على لقب $title. واصل تقدمك!")')
          s = s.replace('speak("تحتاج إلى أربعين نجمة للحصول على هذا اللقب.")', 'speak("لا توجد نجوم كافية للحصول على هذا اللقب. تحتاج إلى أربعين نجمة.")')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/learnlettersnumbers/app/MainActivity.kt app/src/main/java/com/learnlettersnumbers/app/RewardStoreScreen.kt
          git commit -m "Fix rewards speech routing and restore MainActivity"
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/update-games-store.yml
          git add -u .github/workflows/update-games-store.yml
          git commit -m "Remove one-time repair workflow"
          git push
